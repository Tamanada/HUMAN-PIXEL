name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, unit tests, builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Core tests (geo, clock, state machine, formation engine, crowd simulation 1k-50k)
        run: npm run test -w @human-pixel/core
      - name: Build participant app
        run: npm run build -w @human-pixel/participant
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
      - name: Build console
        run: npm run build -w @human-pixel/console
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder

  database:
    name: Database (migrations, RLS, concurrency, recovery)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          # Pinned: the linter lives in the database image that this CLI pulls, so "latest" means
          # a new release can turn CI red with no change of ours. Bump it deliberately.
          version: 2.117.0
      - run: npm ci
      - name: Start Supabase (applies every migration from scratch)
        run: supabase start -x studio,imgproxy,vector,logflare
      - name: Integration tests (includes 12,000 concurrent joins)
        run: npm run test:db -w @human-pixel/simulator
        env:
          HP_DB_URL: postgresql://postgres:postgres@127.0.0.1:55422/postgres
      - name: Lint database (supabase db lint)
        run: supabase db lint --schema public --level warning --fail-on warning
      - if: always()
        run: supabase stop --no-backup
